[project]
name = "sketch_cl_research"
version = "0.1.0"
description = "Refactored continual-learning experiment (SKETCH-CL)"
authors = ["Researcher <research@example.com>"]
readme = "README.md"
license = "MIT"
# --- dependencies must be an array, **not** a mapping (per task instruction) ----
dependencies = [
    "torch>=1.9.0",
    "torchvision>=0.10.0",
    "timm>=0.4.12",
    "datasets>=2.14.0",
    "numpy>=1.21.0",
    "psutil>=5.9.0",
    "matplotlib>=3.5.0",
    "tqdm>=4.60.0",
    "pyyaml>=6.0",
    "pillow>=9.0.0"
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
