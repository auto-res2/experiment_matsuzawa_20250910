[project]
name = "lcamp-gnn-research"
version = "0.1.0"
description = "Research prototype for LCAMP – curvature-aware message passing"
requires-python = ">=3.9"

# ---------------------------------------------------------------------
# Mandatory runtime dependencies.
# ---------------------------------------------------------------------
dependencies = [
    "numpy>=1.21.0",
    "torch>=1.9.0",            # CPU wheels are available on PyPI (avoid CUDA build)
    "torch-geometric>=2.0.0",
    "ogb>=1.3.5",
    "matplotlib>=3.5.0",
    "networkx>=2.6.0",
    "pyyaml>=6.0",
]

[build-system]
requires = ["setuptools>=62", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
all = []
