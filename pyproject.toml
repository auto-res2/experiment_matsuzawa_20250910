[project]
name = "curvadanorm"
version = "0.1.0"
requires-python = ">=3.9"
# ---------------------------------------------------------------------------
# Core, *light-weight* dependencies that are guaranteed to be available in
# very restrictive execution sandboxes (no GPU / scientific wheels).
# ---------------------------------------------------------------------------
dependencies = [
  "numpy>=1.21.0",
  "PyYAML>=5.4",
  "requests>=2.25",
]

[project.optional-dependencies]
full = [
  "torch>=2.0; platform_machine == 'x86_64'",
  "torch_geometric>=2.5.3",
  "torch_scatter>=2.1.2",
  "networkx>=3.0",
  "matplotlib>=3.7",
  "seaborn>=0.13",
  "GraphRicciCurvature~=0.5.3",
]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"